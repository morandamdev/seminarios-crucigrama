<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crucigrama Interactivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            touch-action: manipulation;
        }
        .crossword-cell {
            width: 42px;
            height: 42px;
            min-width: 42px;
            min-height: 42px;
            max-width: 42px;
            max-height: 42px;
            text-align: center;
            text-transform: uppercase;
            font-weight: 700;
            font-size: 1.1rem; /* 16px+ prevents auto-zoom on mobile inputs */
            border: 2px solid #cbd5e1;
            outline: none;
            box-sizing: border-box;
            border-radius: 6px;
            background-color: #ffffff;
            transition: all 0.15s ease;
            padding: 0;
            margin: 0;
            -webkit-appearance: none;
        }
        @media (max-width: 640px) {
            .crossword-cell {
                width: 38px;
                height: 38px;
                min-width: 38px;
                min-height: 38px;
                max-width: 38px;
                max-height: 38px;
                font-size: 1rem;
            }
        }
        .crossword-cell:focus {
            border-color: #4f46e5;
            background-color: #eef2ff;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.25);
            z-index: 10;
        }
        .crossword-cell.vertical-secret {
            background-color: #fef08a;
            border-color: #eab308;
        }
        .crossword-cell.correct {
            background-color: #dcfce7;
            border-color: #22c55e;
            color: #15803d;
        }
        .crossword-cell.incorrect {
            background-color: #fee2e2;
            border-color: #ef4444;
            color: #b91c1c;
        }
        /* Custom scrollbar for hints */
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 8px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-indigo-600 text-white shadow-lg py-4 px-6 text-center sticky top-0 z-20">
        <h1 class="text-xl md:text-2xl font-bold tracking-wide">Crucigrama Familiar Interactivo</h1>
        <p class="text-indigo-200 text-xs md:text-sm mt-0.5">Completa las pistas y descubre la palabra secreta</p>
    </header>

    <main class="flex-grow container mx-auto px-2 sm:px-4 py-6 max-w-6xl grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <section class="lg:col-span-7 bg-white p-4 sm:p-6 rounded-2xl shadow-md border border-slate-200 flex flex-col items-center">
            <div class="flex flex-wrap justify-between w-full mb-4 items-center gap-2">
                <h2 class="text-base md:text-lg font-semibold text-slate-700">Tablero de Juego</h2>
                <div class="flex gap-2">
                    <button onclick="checkAnswers()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs md:text-sm font-semibold px-4 py-2 rounded-xl shadow transition transform active:scale-95">Comprobar</button>
                    <button onclick="resetPuzzle()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs md:text-sm font-semibold px-3 py-2 rounded-xl transition transform active:scale-95">Limpiar</button>
                </div>
            </div>

            <!-- Scrollable board container optimized for mobile touch and overflow -->
            <div id="crossword-board" class="w-full overflow-x-auto p-2 flex justify-start sm:justify-center custom-scroll bg-slate-50 rounded-xl border border-slate-200/80 shadow-inner">
                <!-- Javascript builds the board here -->
            </div>

            <!-- Secret word display area -->
            <div id="secret-word-container" class="mt-6 w-full bg-amber-50 border border-amber-300 p-4 rounded-xl text-center shadow-sm hidden">
                <h3 class="text-amber-800 font-bold text-xs md:text-sm uppercase tracking-wider">¡Palabra Secreta Descubierta!</h3>
                <p id="secret-word-display" class="text-xl md:text-2xl font-black text-amber-600 tracking-widest mt-1"></p>
            </div>
        </section>

        <section class="lg:col-span-5 bg-white p-4 sm:p-6 rounded-2xl shadow-md border border-slate-200 flex flex-col">
            <h2 class="text-base md:text-lg font-semibold text-slate-700 mb-3 border-b pb-2">Pistas del Crucigrama</h2>
            <div class="space-y-2.5 overflow-y-auto max-h-[480px] pr-2 text-xs md:text-sm custom-scroll" id="hints-container">
                <!-- Javascript populates hints -->
            </div>
        </section>

    </main>

    <footer class="bg-white border-t border-slate-200 text-center py-4 text-xs text-slate-500 mt-auto">
        Optimizado para celulares y computadoras. ¡Disfruta jugando!
    </footer>

    <script>
        const wordsData = [
            { num: 1, clue: "Acción de servir a los demás con amor.", word: "SERVICIO", row: 0, col: 2 },
            { num: 2, clue: "Lugar donde hacemos ordenanzas sagradas.", word: "TEMPLOS", row: 1, col: 1 },
            { num: 3, clue: "Relato de la vida de nuestros antepasados.", word: "HISTORIA", row: 2, col: 3 },
            { num: 4, clue: "Grupo eterno al que pertenecemos.", word: "FAMILIA", row: 3, col: 3 },
            { num: 5, clue: "Búsqueda y registro de nuestros antepasados.", word: "GENEALOGIA", row: 4, col: 0 },
            { num: 6, clue: "La ___ de salvación.", word: "OBRA", row: 5, col: 4 },
            { num: 7, clue: "Mostrar respeto y amor por nuestros antepasados.", word: "HONOR", row: 6, col: 3 },
            { num: 8, clue: "Del Espíritu Santo recibimos ___.", word: "INSPIRACION", row: 7, col: 1 },
            { num: 9, clue: "Ayudar a los demás con amor.", word: "AYUDA", row: 8, col: 4 },
            { num: 10, clue: "Personas de anteriores generaciones.", word: "ANCESTROS", row: 9, col: 2 },
            { num: 11, clue: "El bautismo es una ___ sagrada.", word: "ORDENANZA", row: 10, col: 3 },
            { num: 12, clue: "Sentimiento que recibimos al servir a otros.", word: "GOZO", row: 11, col: 2 },
            { num: 13, clue: "Somos hijos de Dios con una ___ divina.", word: "IDENTIDAD", row: 12, col: 0 },
            { num: 14, clue: "Representación de nuestra línea familiar.", word: "ARBOL", row: 13, col: 3 }
        ];

        const totalRows = 14;
        const totalCols = 13;
        let gridMatrix = [];

        function initGrid() {
            gridMatrix = Array(totalRows).fill(null).map(() => Array(totalCols).fill(null));

            wordsData.forEach(item => {
                for (let i = 0; i < item.word.length; i++) {
                    const c = item.col + i;
                    if (!gridMatrix[item.row][c]) {
                        gridMatrix[item.row][c] = {
                            char: item.word[i],
                            number: (i === 0) ? item.num : null,
                            wordNums: [item.num]
                        };
                    } else {
                        if (i === 0 && !gridMatrix[item.row][c].number) {
                            gridMatrix[item.row][c].number = item.num;
                        }
                        if (!gridMatrix[item.row][c].wordNums.includes(item.num)) {
                            gridMatrix[item.row][c].wordNums.push(item.num);
                        }
                    }
                }
            });
        }

        function renderBoard() {
            const boardEl = document.getElementById('crossword-board');
            let html = '<div class="inline-flex flex-col gap-1.5 p-1">';

            for (let r = 0; r < totalRows; r++) {
                html += '<div class="flex gap-1.5 justify-start sm:justify-center">';
                for (let c = 0; c < totalCols; c++) {
                    const cellData = gridMatrix[r][c];
                    if (cellData) {
                        const numLabel = cellData.number ? `<span class="absolute top-0.5 left-1 text-[9px] text-slate-500 font-bold pointer-events-none z-10">${cellData.number}</span>` : '';
                        const isVerticalSecret = (c === 4);
                        const secretClass = isVerticalSecret ? 'vertical-secret' : '';
                        
                        html += `
                            <div class="relative w-[42px] h-[42px] sm:w-[38px] sm:h-[38px] flex-shrink-0">
                                ${numLabel}
                                <input type="text" maxlength="1" 
                                    class="crossword-cell w-full h-full ${secretClass}" 
                                    data-row="${r}" data-col="${c}" 
                                    oninput="handleInput(this, ${r}, ${c})"
                                    onkeydown="handleKeyDown(event, ${r}, ${c})"
                                    onfocus="this.select()"
                                />
                            </div>
                        `;
                    } else {
                        html += '<div class="w-[42px] h-[42px] sm:w-[38px] sm:h-[38px] flex-shrink-0 invisible"></div>';
                    }
                }
                html += '</div>';
            }
            html += '</div>';
            boardEl.innerHTML = html;
            renderHints();
        }

        function renderHints() {
            const container = document.getElementById('hints-container');
            let html = '';
            wordsData.forEach(item => {
                html += `
                    <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200/60 hover:bg-indigo-50/40 transition">
                        <span class="font-bold text-indigo-600 mr-1.5">${item.num}.</span>
                        <span class="text-slate-700">${item.clue}</span>
                        <span class="block text-[11px] text-slate-400 mt-0.5 font-mono">(${item.word.length} letras)</span>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function handleInput(input, r, c) {
            const val = input.value.toUpperCase();
            input.value = val;

            if (val.length === 1) {
                const nextInput = document.querySelector(`input[data-row="${r}"][data-col="${c + 1}"]`);
                if (nextInput) {
                    nextInput.focus();
                }
            }
            checkSecretWordLive();
        }

        function handleKeyDown(event, r, c) {
            if (event.key === 'Backspace') {
                if (event.target.value === '') {
                    const prevInput = document.querySelector(`input[data-row="${r}"][data-col="${c - 1}"]`);
                    if (prevInput) {
                        prevInput.focus();
                        prevInput.value = '';
                    }
                }
            } else if (event.key === 'ArrowRight') {
                const next = document.querySelector(`input[data-row="${r}"][data-col="${c + 1}"]`);
                if (next) next.focus();
            } else if (event.key === 'ArrowLeft') {
                const prev = document.querySelector(`input[data-row="${r}"][data-col="${c - 1}"]`);
                if (prev) prev.focus();
            } else if (event.key === 'ArrowDown') {
                const down = document.querySelector(`input[data-row="${r + 1}"][data-col="${c}"]`);
                if (down) down.focus();
            } else if (event.key === 'ArrowUp') {
                const up = document.querySelector(`input[data-row="${r - 1}"][data-col="${c}"]`);
                if (up) up.focus();
            }
        }

        function checkAnswers() {
            const inputs = document.querySelectorAll('.crossword-cell');
            let allCorrect = true;
            let filledCount = 0;

            inputs.forEach(input => {
                const r = parseInt(input.dataset.row);
                const c = parseInt(input.dataset.col);
                const expectedChar = gridMatrix[r][c].char;
                const userVal = input.value.toUpperCase();

                input.classList.remove('correct', 'incorrect');

                if (userVal !== '') {
                    filledCount++;
                    if (userVal === expectedChar) {
                        input.classList.add('correct');
                    } else {
                        input.classList.add('incorrect');
                        allCorrect = false;
                    }
                } else {
                    allCorrect = false;
                }
            });

            if (filledCount === 0) {
                showNotification("¡El crucigrama está vacío! Rellena algunas casillas primero.", "bg-amber-500");
            } else if (allCorrect) {
                showNotification("¡Felicidades! Has completado todo el crucigrama correctamente 🎉", "bg-emerald-600");
            } else {
                showNotification("Hay algunos errores marcados en rojo. ¡Revisa e inténtalo de nuevo!", "bg-rose-600");
            }
            checkSecretWordLive();
        }

        function checkSecretWordLive() {
            const secretCol = 4;
            let secretString = "";

            for (let r = 0; r < totalRows; r++) {
                if (gridMatrix[r][secretCol]) {
                    const input = document.querySelector(`input[data-row="${r}"][data-col="${secretCol}"]`);
                    const val = input ? input.value.toUpperCase() : "";
                    secretString += val ? val : "_";
                }
            }

            const container = document.getElementById('secret-word-container');
            const display = document.getElementById('secret-word-display');
            
            if (secretString.replace(/_/g, "").length > 0) {
                container.classList.remove('hidden');
                display.textContent = secretString;
            } else {
                container.classList.add('hidden');
            }
        }

        function resetPuzzle() {
            const inputs = document.querySelectorAll('.crossword-cell');
            inputs.forEach(input => {
                input.value = '';
                input.classList.remove('correct', 'incorrect');
            });
            document.getElementById('secret-word-container').classList.add('hidden');
        }

        function showNotification(message, bgClass) {
            const existingToast = document.getElementById('toast-notification');
            if (existingToast) existingToast.remove();

            const toast = document.createElement('div');
            toast.id = 'toast-notification';
            toast.className = `fixed bottom-6 left-1/2 transform -translate-x-1/2 ${bgClass} text-white px-5 py-3 rounded-2xl shadow-xl z-50 text-xs md:text-sm font-medium transition-all duration-300`;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        window.onload = function() {
            initGrid();
            renderBoard();
        };
    </script>
</body>
</html>
