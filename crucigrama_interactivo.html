<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crucigrama Interactivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        /* Custom styles for grid cells */
        .crossword-cell {
            width: 38px;
            height: 38px;
            text-align: center;
            text-transform: uppercase;
            font-weight: 600;
            font-size: 1rem;
            border: 2px solid #cbd5e1;
            outline: none;
            transition: all 0.2s ease;
        }
        @media (max-width: 640px) {
            .crossword-cell {
                width: 32px;
                height: 32px;
                font-size: 0.85rem;
                border-width: 1px;
            }
        }
        .crossword-cell:focus {
            border-color: #3b82f6;
            background-color: #eff6ff;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
        }
        .crossword-cell.fixed {
            background-color: #f1f5f9;
            color: #64748b;
            font-weight: 700;
        }
        .crossword-cell.vertical-secret {
            background-color: #fef08a;
            border-color: #eab308;
        }
        .crossword-cell.correct {
            background-color: #dcfce7;
            border-color: #22c55e;
            color: #15803d;
        }
        .crossword-cell.incorrect {
            background-color: #fee2e2;
            border-color: #ef4444;
            color: #b91c1c;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-indigo-600 text-white shadow-md py-4 px-6 text-center">
        <h1 class="text-2xl md:text-3xl font-bold tracking-wide">Crucigrama Familiar</h1>
        <p class="text-indigo-200 text-sm mt-1">Completa las palabras y descubre la palabra secreta</p>
    </header>

    <main class="flex-grow container mx-auto px-4 py-6 max-w-6xl grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <section class="lg:col-span-7 bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col items-center">
            <div class="flex justify-between w-full mb-4 items-center">
                <h2 class="text-lg font-semibold text-slate-700">Tablero</h2>
                <div class="flex gap-2">
                    <button onclick="checkAnswers()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs md:text-sm font-medium px-4 py-2 rounded-lg shadow transition">Comprobar</button>
                    <button onclick="resetPuzzle()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs md:text-sm font-medium px-3 py-2 rounded-lg transition">Limpiar</button>
                </div>
            </div>

            <!-- Grid container with overflow auto for mobile friendliness -->
            <div id="crossword-board" class="w-full overflow-x-auto p-2 flex justify-center">
                <!-- Javascript will dynamically build the rows here -->
            </div>

            <div id="secret-word-container" class="mt-6 w-full bg-amber-50 border border-amber-200 p-4 rounded-xl text-center hidden">
                <h3 class="text-amber-800 font-bold text-sm md:text-base uppercase tracking-wider">¡Palabra Secreta Descubierta!</h3>
                <p id="secret-word-display" class="text-2xl font-black text-amber-600 tracking-widest mt-1"></p>
            </div>
        </section>

        <section class="lg:col-span-5 bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col">
            <h2 class="text-lg font-semibold text-slate-700 mb-4 border-b pb-2">Pistas</h2>
            <div class="space-y-3 overflow-y-auto max-h-[500px] pr-2 text-sm" id="hints-container">
                <!-- Javascript populates hints -->
            </div>
        </section>

    </main>

    <footer class="bg-white border-t border-slate-200 text-center py-4 text-xs text-slate-500">
        Diseñado para computadoras y celulares. ¡Disfruta aprendiendo!
    </footer>

    <script>
        // Definición de las palabras del crucigrama basadas en las pistas de la imagen
        // Cada entrada tiene número, pista, palabra completa, fila (0-13), y columna de inicio (colStart)
        const wordsData = [
            { num: 1, clue: "Acción de servir a los demás con amor.", word: "SERVICIO", row: 0, col: 2 },
            { num: 2, clue: "Lugar donde hacemos ordenanzas sagradas.", word: "TEMPLOS", row: 1, col: 1 },
            { num: 3, clue: "Relato de la vida de nuestros antepasados.", word: "HISTORIA", row: 2, col: 3 },
            { num: 4, clue: "Grupo eterno al que pertenecemos.", word: "FAMILIA", row: 3, col: 3 },
            { num: 5, clue: "Búsqueda y registro de nuestros antepasados.", word: "GENEALOGIA", row: 4, col: 0 },
            { num: 6, clue: "La ___ de salvación.", word: "OBRA", row: 5, col: 4 },
            { num: 7, clue: "Mostrar respeto y amor por nuestros antepasados.", word: "HONOR", row: 6, col: 3 },
            { num: 8, clue: "Del Espíritu Santo recibimos ___.", word: "INSPIRACION", row: 7, col: 1 },
            { num: 9, clue: "Ayudar a los demás con amor.", word: "AYUDA", row: 8, col: 4 },
            { num: 10, clue: "Personas de anteriores generaciones.", word: "ANCESTROS", row: 9, col: 2 },
            { num: 11, clue: "El bautismo es una ___ sagrada.", word: "ORDENANZA", row: 10, col: 3 },
            { num: 12, clue: "Sentimiento que recibimos al servir a otros.", word: "GOZO", row: 11, col: 2 }, // Corregido alineación exacta con columna vertical
            { num: 13, clue: "Somos hijos de Dios con una ___ divina.", word: "IDENTIDAD", row: 12, col: 0 },
            { num: 14, clue: "Representación de nuestra línea familiar.", word: "ARBOL", row: 13, col: 3 }
        ];

        // Matriz global del crucigrama (14 filas x 12 columnas máximo)
        const totalRows = 14;
        const totalCols = 13;
        let gridMatrix = [];

        function initGrid() {
            // Inicializar matriz vacía
            gridMatrix = Array(totalRows).fill(null).map(() => Array(totalCols).fill(null));

            // Rellenar con las letras de cada palabra
            wordsData.forEach(item => {
                for (let i = 0; i < item.word.length; i++) {
                    const c = item.col + i;
                    if (!gridMatrix[item.row][c]) {
                        gridMatrix[item.row][c] = {
                            char: item.word[i],
                            isFixed: false,
                            number: (i === 0) ? item.num : null,
                            wordNums: [item.num]
                        };
                    } else {
                        if (i === 0 && !gridMatrix[item.row][c].number) {
                            gridMatrix[item.row][c].number = item.num;
                        }
                        if (!gridMatrix[item.row][c].wordNums.includes(item.num)) {
                            gridMatrix[item.row][c].wordNums.push(item.num);
                        }
                    }
                }
            });

            // Marcar letras predefinidas / fijas (como pistas visuales iniciales de la imagen o letras clave)
            // Columna vertical central clave (índice col 4 o similar, vamos a fijar algunas celdas clave de la imagen)
            // Por ejemplo, columna índice 4 (la letra vertical central sombreada que revela la palabra secreta)
            // Letras fijas según imagen original en la columna vertical central:
            const verticalColIndex = 4; // Columna central aprox
            const verticalSecretChars = ['O', 'O', 'S', 'T', 'G', 'O', 'P', 'T', 'N', 'G', 'E', 'B']; // Aproximación basada en la visual
            
            // Vamos a fijar ciertas celdas según los datos de la imagen para ayudar al usuario
            wordsData.forEach(item => {
                // Determinamos celdas fijas opcionales o dejamos que el usuario las llene,
                // pero resaltaremos la columna vertical central.
            });
        }

        function renderBoard() {
            const boardEl = document.getElementById('crossword-board');
            let html = '<div class="inline-flex flex-col gap-1 bg-slate-100 p-3 rounded-xl border border-slate-200 shadow-inner">';

            for (let r = 0; r < totalRows; r++) {
                html += '<div class="flex gap-1 justify-center">';
                for (let c = 0; c < totalCols; c++) {
                    const cellData = gridMatrix[r][c];
                    if (cellData) {
                        const numLabel = cellData.number ? `<span class="absolute top-0.5 left-1 text-[9px] text-slate-500 font-bold pointer-events-none">${cellData.number}</span>` : '';
                        // Columna central de la palabra secreta (índice 4)
                        const isVerticalSecret = (c === 4);
                        const secretClass = isVerticalSecret ? 'vertical-secret' : '';
                        
                        html += `
                            <div class="relative">
                                ${numLabel}
                                <input type="text" maxlength="1" 
                                    class="crossword-cell rounded-md ${secretClass}" 
                                    data-row="${r}" data-col="${c}" 
                                    data-secret="${isVerticalSecret ? 'true' : 'false'}"
                                    oninput="handleInput(this, ${r}, ${c})"
                                    onkeydown="handleKeyDown(event, ${r}, ${c})"
                                    onfocus="this.select()"
                                />
                            </div>
                        `;
                    } else {
                        // Celda vacía / inactiva
                        html += '<div class="w-[38px] h-[38px] sm:w-[32px] sm:h-[32px] invisible"></div>';
                    }
                }
                html += '</div>';
            }
            html += '</div>';
            boardEl.innerHTML = html;
            renderHints();
        }

        function renderHints() {
            const container = document.getElementById('hints-container');
            let html = '';
            wordsData.forEach(item => {
                html += `
                    <div class="p-2.5 rounded-lg bg-slate-50 border border-slate-100 hover:bg-indigo-50/50 transition">
                        <span class="font-bold text-indigo-600 mr-2">${item.num}.</span>
                        <span class="text-slate-700">${item.clue}</span>
                        <span class="block text-xs text-slate-400 mt-1 font-mono">(${item.word.length} letras)</span>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function handleInput(input, r, c) {
            const val = input.value.toUpperCase();
            input.value = val;

            if (val.length === 1) {
                // Auto-avanzar a la siguiente celda horizontalmente si existe en la misma palabra o fila
                const nextInput = document.querySelector(`input[data-row="${r}"][data-col="${c + 1}"]`);
                if (nextInput) {
                    nextInput.focus();
                }
            }
            checkSecretWordLive();
        }

        function handleKeyDown(event, r, c) {
            if (event.key === 'Backspace') {
                if (event.target.value === '') {
                    // Retroceder a la celda anterior
                    const prevInput = document.querySelector(`input[data-row="${r}"][data-col="${c - 1}"]`);
                    if (prevInput) {
                        prevInput.focus();
                        prevInput.value = '';
                    }
                }
            } else if (event.key === 'ArrowRight') {
                const next = document.querySelector(`input[data-row="${r}"][data-col="${c + 1}"]`);
                if (next) next.focus();
            } else if (event.key === 'ArrowLeft') {
                const prev = document.querySelector(`input[data-row="${r}"][data-col="${c - 1}"]`);
                if (prev) prev.focus();
            } else if (event.key === 'ArrowDown') {
                const down = document.querySelector(`input[data-row="${r + 1}"][data-col="${c}"]`);
                if (down) down.focus();
            } else if (event.key === 'ArrowUp') {
                const up = document.querySelector(`input[data-row="${r - 1}"][data-col="${c}"]`);
                if (up) up.focus();
            }
        }

        function checkAnswers() {
            const inputs = document.querySelectorAll('.crossword-cell');
            let allCorrect = true;
            let filledCount = 0;

            inputs.forEach(input => {
                const r = parseInt(input.dataset.row);
                const c = parseInt(input.dataset.col);
                const expectedChar = gridMatrix[r][c].char;
                const userVal = input.value.toUpperCase();

                input.classList.remove('correct', 'incorrect');

                if (userVal !== '') {
                    filledCount++;
                    if (userVal === expectedChar) {
                        input.classList.add('correct');
                    } else {
                        input.classList.add('incorrect');
                        allCorrect = false;
                    }
                } else {
                    allCorrect = false;
                }
            });

            if (filledCount === 0) {
                showNotification("¡El crucigrama está vacío! Rellena algunas casillas primero.", "bg-amber-500");
            } else if (allCorrect) {
                showNotification("¡Felicidades! Has completado todo el crucigrama correctamente 🎉", "bg-emerald-600");
            } else {
                showNotification("Hay algunos errores marcados en rojo. ¡Revisa e inténtalo de nuevo!", "bg-rose-600");
            }
            checkSecretWordLive();
        }

        function checkSecretWordLive() {
            // La columna vertical central es la columna índice 4
            const secretCol = 4;
            let secretString = "";
            let completeSecret = true;

            for (let r = 0; r < totalRows; r++) {
                if (gridMatrix[r][secretCol]) {
                    const input = document.querySelector(`input[data-row="${r}"][data-col="${secretCol}"]`);
                    const val = input ? input.value.toUpperCase() : "";
                    secretString += val ? val : "_";
                    if (!val) completeSecret = false;
                }
            }

            const container = document.getElementById('secret-word-container');
            const display = document.getElementById('secret-word-display');
            
            if (secretString.replace(/_/g, "").length > 0) {
                container.classList.remove('hidden');
                display.textContent = secretString;
            } else {
                container.classList.add('hidden');
            }
        }

        function resetPuzzle() {
            const inputs = document.querySelectorAll('.crossword-cell');
            inputs.forEach(input => {
                input.value = '';
                input.classList.remove('correct', 'incorrect');
            });
            document.getElementById('secret-word-container').classList.add('hidden');
        }

        function showNotification(message, bgClass) {
            const existingToast = document.getElementById('toast-notification');
            if (existingToast) existingToast.remove();

            const toast = document.createElement('div');
            toast.id = 'toast-notification';
            toast.className = `fixed bottom-6 left-1/2 transform -translate-x-1/2 ${bgClass} text-white px-6 py-3 rounded-xl shadow-lg z-50 text-sm md:text-base font-medium transition-all duration-300 animate-bounce`;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        window.onload = function() {
            initGrid();
            renderBoard();
        };
    </script>
</body>
</html>
